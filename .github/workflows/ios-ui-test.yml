name: UI Test OpenBooks

on:
  workflow_dispatch:

jobs:
  ui-test:
    runs-on: macos-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Mostrar version de Xcode
        run: xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto de Xcode
        run: xcodegen generate

      - name: Instalar Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Buscar un iPhone Simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          for devices in data["devices"].values():
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)

          sys.exit(1)
          ')

          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Simulator seleccionado: $UDID"

      - name: Encender Simulator
        run: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Compilar OpenBooks
        run: |
          rm -rf build

          xcodebuild \
            -project OpenBooks.xcodeproj \
            -scheme OpenBooks \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ejecutar pruebas unitarias XCTest
        run: |
          xcodebuild \
            -project OpenBooks.xcodeproj \
            -scheme OpenBooks \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            -resultBundlePath unit-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Guardar resultado de XCTest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OpenBooks-XCTest
          path: unit-tests.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Instalar OpenBooks
        run: |
          xcrun simctl install \
            "$SIMULATOR_UDID" \
            "build/Build/Products/Debug-iphonesimulator/OpenBooks.app"

      - name: Grabar cambio entre modo claro y oscuro
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capturas-aspecto

          python3 - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          import signal
          import subprocess
          import time

          udid = os.environ["SIMULATOR_UDID"]
          folder = Path("capturas-aspecto")
          video = folder / "03-cambio-claro-oscuro.mp4"

          def simctl(*args):
              subprocess.run(["xcrun", "simctl", *args], check=True)

          simctl("ui", udid, "appearance", "light")
          # La aplicación ya está instalada por el paso anterior.
          simctl("launch", udid, "com.openbooks.app")
          time.sleep(4)

          recorder = subprocess.Popen([
              "xcrun", "simctl", "io", udid,
              "recordVideo", "--codec=h264", str(video)
          ])
          try:
              time.sleep(3)
              simctl("io", udid, "screenshot", str(folder / "01-inicio-claro.png"))
              time.sleep(2)

              # Cambiar la apariencia del iPhone sin cerrar OpenBooks.
              simctl("ui", udid, "appearance", "dark")
              time.sleep(6)
              simctl("io", udid, "screenshot", str(folder / "02-inicio-oscuro.png"))
              time.sleep(2)

              # Mostrar también el regreso al modo claro.
              simctl("ui", udid, "appearance", "light")
              time.sleep(5)
          finally:
              if recorder.poll() is None:
                  recorder.send_signal(signal.SIGINT)
              recorder.wait(timeout=30)

          images = [folder / "01-inicio-claro.png", folder / "02-inicio-oscuro.png"]
          for path in [*images, video]:
              if not path.is_file() or path.stat().st_size < 1000:
                  raise RuntimeError(f"No se generó correctamente: {path}")

          checksums = [hashlib.sha256(path.read_bytes()).hexdigest() for path in images]
          if checksums[0] == checksums[1]:
              raise RuntimeError("Las capturas clara y oscura son idénticas")

          print("Video y capturas de ambos aspectos generados")
          PYTHON

          xcrun simctl terminate "$SIMULATOR_UDID" com.openbooks.app

      - name: Guardar video y capturas de ambos aspectos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OpenBooks-Claro-Oscuro
          path: capturas-aspecto/*
          if-no-files-found: warn
          retention-days: 7

      - name: Ejecutar prueba de estado compartido
        run: |
          maestro \
            --device="$SIMULATOR_UDID" \
            test \
            .maestro/shared-state.yaml \
            --test-output-dir=maestro-output

      - name: Ejecutar prueba del buscador
        run: |
          maestro \
            --device="$SIMULATOR_UDID" \
            test \
            .maestro/search-flow.yaml \
            --test-output-dir=maestro-output

      - name: Grabar recorrido completo
        run: |
          maestro \
            --device="$SIMULATOR_UDID" \
            test \
            .maestro/recorrido-completo.yaml \
            --test-output-dir=maestro-output

      - name: Verificar persistencia tras reiniciar la app
        run: |
          maestro \
            --device="$SIMULATOR_UDID" \
            test \
            .maestro/persistence-flow.yaml \
            --test-output-dir=maestro-output

      - name: Comprobar estados de red y reintento
        run: |
          maestro \
            --device="$SIMULATOR_UDID" \
            test \
            .maestro/networking-states.yaml \
            --test-output-dir=maestro-output

      - name: Consultar Open Library real
        run: |
          maestro \
            --device="$SIMULATOR_UDID" \
            test \
            .maestro/open-library-live.yaml \
            --test-output-dir=maestro-output

      - name: Grabar recorrido real completo
        run: |
          maestro \
            --device="$SIMULATOR_UDID" \
            test \
            .maestro/recorrido-real-completo.yaml \
            --test-output-dir=maestro-output

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OpenBooks-UI-Test
          path: maestro-output
          if-no-files-found: warn
          retention-days: 7
