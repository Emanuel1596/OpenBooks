name: UI Test OpenBooks

on:
  workflow_dispatch:

jobs:
  ui-test:
    runs-on: macos-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Mostrar version de Xcode
        run: xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto de Xcode
        run: xcodegen generate

      - name: Instalar Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Buscar un iPhone Simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          for devices in data["devices"].values():
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)

          sys.exit(1)
          ')

          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Simulator seleccionado: $UDID"

      - name: Encender Simulator
        run: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Compilar OpenBooks
        run: |
          rm -rf build

          xcodebuild \
            -project OpenBooks.xcodeproj \
            -scheme OpenBooks \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ejecutar pruebas unitarias XCTest
        run: |
          xcodebuild \
            -project OpenBooks.xcodeproj \
            -scheme OpenBooks \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            -resultBundlePath unit-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Guardar resultado de XCTest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OpenBooks-XCTest
          path: unit-tests.xcresult
          if-no-files-found: warn
          retention-days: 7

      - name: Instalar OpenBooks
        run: |
          xcrun simctl install \
            "$SIMULATOR_UDID" \
            "build/Build/Products/Debug-iphonesimulator/OpenBooks.app"

      - name: Comprobar aspecto claro y oscuro
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capturas-aspecto

          xcrun simctl ui "$SIMULATOR_UDID" appearance light
          xcrun simctl launch "$SIMULATOR_UDID" com.openbooks.app
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot "capturas-aspecto/01-inicio-claro.png"

          xcrun simctl terminate "$SIMULATOR_UDID" com.openbooks.app
          xcrun simctl ui "$SIMULATOR_UDID" appearance dark
          xcrun simctl launch "$SIMULATOR_UDID" com.openbooks.app
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot "capturas-aspecto/02-inicio-oscuro.png"

          test -s "capturas-aspecto/01-inicio-claro.png"
          test -s "capturas-aspecto/02-inicio-oscuro.png"
          xcrun simctl terminate "$SIMULATOR_UDID" com.openbooks.app

      - name: Guardar capturas de ambos aspectos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OpenBooks-Claro-Oscuro
          path: capturas-aspecto/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Ejecutar prueba de estado compartido
        run: |
          maestro \
            --device="$SIMULATOR_UDID" \
            test \
            .maestro/shared-state.yaml \
            --test-output-dir=maestro-output

      - name: Ejecutar prueba del buscador
        run: |
          maestro \
            --device="$SIMULATOR_UDID" \
            test \
            .maestro/search-flow.yaml \
            --test-output-dir=maestro-output

      - name: Grabar recorrido completo
        run: |
          maestro \
            --device="$SIMULATOR_UDID" \
            test \
            .maestro/recorrido-completo.yaml \
            --test-output-dir=maestro-output

      - name: Verificar persistencia tras reiniciar la app
        run: |
          maestro \
            --device="$SIMULATOR_UDID" \
            test \
            .maestro/persistence-flow.yaml \
            --test-output-dir=maestro-output

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OpenBooks-UI-Test
          path: maestro-output
          if-no-files-found: warn
          retention-days: 7
