appId: com.openbooks.app
---
- launchApp:
    clearState: true
    arguments:
      useMockSearch: "true"
- assertVisible: "OpenBooks"
- startRecording: estados-error-reintento-sin-resultados
- tapOn: "Buscar libros"
- assertVisible: "Buscar libros"
- tapOn: "Buscar libros"
- inputText: "Error de prueba"
- takeScreenshot: "error-antes-de-enter"
- pressKey: enter
- takeScreenshot: "error-despues-de-enter"
- extendedWaitUntil:
    visible: "Resultados"
    timeout: 20000
- extendedWaitUntil:
    visible: "No se pudieron cargar los libros"
    timeout: 20000
- assertVisible: "Intentar nuevamente"
- takeScreenshot: "busqueda-error"
- tapOn: "Intentar nuevamente"
- assertVisible: "No se pudieron cargar los libros"
- tapOn: "Buscar libros"
- tapOn: "Buscar libros"
- eraseText: 50
- inputText: "Libro que no existe 12345"
- pressKey: enter
- assertVisible: "No se encontraron libros"
- takeScreenshot: "busqueda-sin-resultados"
- stopRecording
